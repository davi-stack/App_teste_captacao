// Aplicando plugins
plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.facebook.react'
}

// Configuração do React Native
react {
    autolinkLibrariesWithApp()
}

// Configurações gerais do projeto
def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    namespace "com.meuapp"

    defaultConfig {
        applicationId "com.backgroundgeolocation.reactnative"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "LOG_FILE", "\"network_log.csv\""
        buildConfigField "int", "TIME_COLETA", "15"
        buildConfigField "String", "URL_EXPORT", "\"http://54.233.209.5:8080/upload-csv/\""
        buildConfigField "int", "MAX_LINES", "100"
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    ndkVersion rootProject.ext.ndkVersion
}

dependencies {
    // React Native
    implementation("com.facebook.react:react-android")
    
    // Google Play Services
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation "com.google.android.gms:play-services-tasks:18.0.2"

    implementation 'com.facebook.react:react-native-gradle-plugin:0.71.8'
    // WorkManager & Coroutines
    implementation "androidx.work:work-runtime-ktx:2.7.1"
    implementation "androidx.concurrent:concurrent-futures-ktx:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.0"

    // .AAR local
    implementation files('libs/network-lib-release.aar')

    // Hermes (opcional)
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
